name: Normalize vmspawn guard style final

on:
  pull_request:
    branches:
      - automation/vmspawn-style2-base
    paths:
      - .github/vmspawn-style-final-trigger

permissions:
  contents: write

jobs:
  normalize-style:
    if: github.repository == 'teamleaderleo/systemd'
    runs-on: ubuntu-22.04
    timeout-minutes: 5

    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: repair/vmspawn-unmapped-bind-userns-2dd0706
          fetch-depth: 0

      - name: Normalize guarded namespace block
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/vmspawn/vmspawn.c')
          text = path.read_text()
          function_start = text.index('static int start_virtiofsd(')
          child_start = text.index('                /* Child */', function_start)
          start = text.index('                if (userns_fd >= 0) {', child_start)
          end_marker = '\n                if (userns_fd >= 0 && unshare(CLONE_NEWNS) < 0) {'
          end = text.index(end_marker, start)

          new = '\n'.join([
              ' ' * 16 + 'if (userns_fd >= 0) {',
              ' ' * 24 + 'r = namespace_enter(',
              ' ' * 40 + '/* pidns_fd= */ -EBADF,',
              ' ' * 40 + '/* mntns_fd= */ -EBADF,',
              ' ' * 40 + '/* netns_fd= */ -EBADF,',
              ' ' * 40 + 'userns_fd,',
              ' ' * 40 + '/* root_fd= */ -EBADF);',
              ' ' * 24 + 'if (r < 0) {',
              ' ' * 32 + 'log_error_errno(r, "Failed to enter user namespace for virtiofsd: %m");',
              ' ' * 32 + '_exit(EXIT_FAILURE);',
              ' ' * 24 + '}',
              ' ' * 16 + '}',
          ])

          path.write_text(text[:start] + new + text[end:])
          PY

          bash -n test/units/TEST-87-AUX-UTILS-VM.vmspawn-user-bind.sh
          git diff --check

      - name: Commit formatting correction
        shell: bash
        run: |
          set -euxo pipefail
          if git diff --quiet -- src/vmspawn/vmspawn.c; then
            echo 'Guard formatting already normalized.'
            exit 0
          fi
          git config user.name 'Linux Fieldwork'
          git config user.email 'fieldwork@example.invalid'
          git add src/vmspawn/vmspawn.c
          git commit -m 'vmspawn: normalize optional user namespace guard'
          git push origin HEAD:repair/vmspawn-unmapped-bind-userns-2dd0706
