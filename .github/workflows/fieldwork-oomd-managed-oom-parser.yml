---
# SPDX-License-Identifier: LGPL-2.1-or-later
name: Fieldwork OOMD managed message parser

on:
  push:
    branches:
      - linux-fieldwork/oomd-managed-oom-parser
    paths:
      - ".github/workflows/fieldwork-oomd-managed-oom-parser.yml"
      - "src/oom/meson.build"
      - "src/oom/oomd-managed-oom-message.c"
      - "src/oom/oomd-managed-oom-message.h"
      - "src/oom/test-oomd-managed-oom-message.c"
  pull_request:
    branches:
      - linux-fieldwork/oomd-batch-updates
    paths:
      - ".github/workflows/fieldwork-oomd-managed-oom-parser.yml"
      - "src/oom/meson.build"
      - "src/oom/oomd-managed-oom-message.c"
      - "src/oom/oomd-managed-oom-message.h"
      - "src/oom/test-oomd-managed-oom-message.c"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.sha }}
  cancel-in-progress: true

env:
  EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  EVIDENCE_DIR: ${{ runner.temp }}/fieldwork-oomd-managed-message-parser-evidence

jobs:
  managed-message-parser:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact parser head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          persist-credentials: false

      - name: Verify execution identity
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          mkdir -p "$EVIDENCE_DIR"

      - uses: systemd/mkosi@f7762b71437227922a367bb89597843c77494ef9

      - name: Configure Arch tools tree
        run: |
          tee mkosi/mkosi.local.conf <<EOF
          [Distribution]
          Distribution=arch
          Release=rolling

          [Build]
          ToolsTreeDistribution=arch
          ToolsTreeRelease=rolling
          WithTests=yes
          Environment=
                  CFLAGS="-Og"
                  MESON_OPTIONS=--werror
          EOF

      - name: Build tools tree
        run: sudo mkosi -f box -- true

      - name: Configure Meson
        run: |
          sudo mkosi box -- meson setup \
            --buildtype=debugoptimized \
            -Dbpf-framework=disabled \
            build

      - name: Compile parser and model tests
        run: |
          set -o pipefail
          sudo mkosi box -- meson compile -C build \
            test-oomd-policy \
            test-oomd-reporter-lifecycle \
            test-oomd-reporter-registry \
            test-oomd-reporter-adapter \
            test-oomd-reporter-adapter-reuse \
            test-oomd-reporter-adapter-events \
            test-oomd-reporter-batch \
            test-oomd-managed-oom-message \
            |& tee "$EVIDENCE_DIR/compile-oomd-managed-message-parser.txt"

      - name: Run parser and model tests
        run: |
          set -o pipefail
          sudo mkosi box -- meson test -C build --no-rebuild \
            --print-errorlogs \
            test-oomd-policy \
            test-oomd-reporter-lifecycle \
            test-oomd-reporter-registry \
            test-oomd-reporter-adapter \
            test-oomd-reporter-adapter-reuse \
            test-oomd-reporter-adapter-events \
            test-oomd-reporter-batch \
            test-oomd-managed-oom-message \
            |& tee "$EVIDENCE_DIR/test-oomd-managed-message-parser.txt"

      - name: Verify clean diff
        run: |
          git diff --check
          test -z "$(git status --porcelain)"

      - name: Record exact receipt
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess

          head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          expected = os.environ["EXPECTED_HEAD"]
          if head != expected:
              raise SystemExit(f"execution identity mismatch: {head} != {expected}")

          receipt = {
              "schema_version": 1,
              "controlled_fork_head": head,
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "target": "strict owned ManagedOOM cgroups array parser",
              "execution_identity": "direct-controlled-fork-head",
              "whole_message_failure": True,
              "owned_typed_batch": True,
              "duplicate_property_path_rejection": True,
              "manager_integration": False,
              "external_contact": False,
          }
          evidence = Path(os.environ["EVIDENCE_DIR"])
          evidence.mkdir(parents=True, exist_ok=True)
          (evidence / "receipt.json").write_text(
              json.dumps(receipt, indent=2) + "\n", encoding="utf-8"
          )
          print(json.dumps(receipt, indent=2))
          PY

      - name: Upload parser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fieldwork-oomd-managed-message-parser-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: warn
          retention-days: 14
