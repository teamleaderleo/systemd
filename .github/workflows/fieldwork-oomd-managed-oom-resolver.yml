---
# SPDX-License-Identifier: LGPL-2.1-or-later
name: Fieldwork OOMD managed message resolver

on:
  push:
    branches:
      - linux-fieldwork/oomd-managed-oom-resolver
    paths:
      - ".github/workflows/fieldwork-oomd-managed-oom-resolver.yml"
      - "src/oom/meson.build"
      - "src/oom/oomd-managed-oom-resolver.c"
      - "src/oom/oomd-managed-oom-resolver.h"
      - "src/oom/test-oomd-managed-oom-resolver.c"
  pull_request:
    branches:
      - linux-fieldwork/oomd-managed-oom-parser
    paths:
      - ".github/workflows/fieldwork-oomd-managed-oom-resolver.yml"
      - "src/oom/meson.build"
      - "src/oom/oomd-managed-oom-resolver.c"
      - "src/oom/oomd-managed-oom-resolver.h"
      - "src/oom/test-oomd-managed-oom-resolver.c"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.sha }}
  cancel-in-progress: true

env:
  EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  EVIDENCE_DIR: ${{ runner.temp }}/fieldwork-oomd-managed-message-resolver-evidence

jobs:
  managed-message-resolver:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact resolver head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          persist-credentials: false

      - name: Verify execution identity
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          mkdir -p "$EVIDENCE_DIR"
          {
            echo "EXPECTED_HEAD=$EXPECTED_HEAD"
            echo "ACTUAL_HEAD=$(git rev-parse HEAD)"
            echo "WHOLE_BATCH_RESOLUTION=true"
            echo "LIVE_MANAGER_INTEGRATION=false"
            echo "EXTERNAL_CONTACT=false"
          } | tee "$EVIDENCE_DIR/identity.txt"

      - uses: systemd/mkosi@f7762b71437227922a367bb89597843c77494ef9

      - name: Configure Arch tools tree
        run: |
          tee mkosi/mkosi.local.conf <<EOF
          [Distribution]
          Distribution=arch
          Release=rolling

          [Build]
          ToolsTreeDistribution=arch
          ToolsTreeRelease=rolling
          WithTests=yes
          Environment=
                  CFLAGS="-Og"
                  MESON_OPTIONS=--werror
          EOF

      - name: Build tools tree
        run: sudo mkosi -f box -- true

      - name: Configure Meson
        run: |
          sudo mkosi box -- meson setup \
            --buildtype=debugoptimized \
            -Dbpf-framework=disabled \
            build

      - name: Compile resolver and model tests
        run: |
          set -o pipefail
          sudo mkosi box -- meson compile -C build \
            test-oomd-policy \
            test-oomd-reporter-lifecycle \
            test-oomd-reporter-registry \
            test-oomd-reporter-adapter \
            test-oomd-reporter-adapter-reuse \
            test-oomd-reporter-adapter-events \
            test-oomd-reporter-batch \
            test-oomd-managed-oom-message \
            test-oomd-managed-oom-resolver \
            |& tee "$EVIDENCE_DIR/compile-oomd-managed-message-resolver.txt"

      - name: Run resolver and model tests
        run: |
          set -o pipefail
          sudo mkosi box -- meson test -C build --no-rebuild \
            --print-errorlogs \
            test-oomd-policy \
            test-oomd-reporter-lifecycle \
            test-oomd-reporter-registry \
            test-oomd-reporter-adapter \
            test-oomd-reporter-adapter-reuse \
            test-oomd-reporter-adapter-events \
            test-oomd-reporter-batch \
            test-oomd-managed-oom-message \
            test-oomd-managed-oom-resolver \
            |& tee "$EVIDENCE_DIR/test-oomd-managed-message-resolver.txt"

      - name: Verify clean diff
        run: |
          git diff --check
          test -z "$(git status --porcelain)"

      - name: Record exact receipt
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess

          head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          expected = os.environ["EXPECTED_HEAD"]
          if head != expected:
              raise SystemExit(f"execution identity mismatch: {head} != {expected}")

          receipt = {
              "schema_version": 1,
              "controlled_fork_head": head,
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "target": "whole-batch ManagedOOM authorization and default resolution",
              "execution_identity": "direct-controlled-fork-head",
              "validation_before_authorization": True,
              "defaults_before_authorization": True,
              "authorization_before_output_allocation": True,
              "failure_clears_output": True,
              "zero_limit_default_supported": True,
              "owned_policy_batch": True,
              "manager_integration": False,
              "external_contact": False,
          }
          evidence = Path(os.environ["EVIDENCE_DIR"])
          evidence.mkdir(parents=True, exist_ok=True)
          (evidence / "receipt.json").write_text(
              json.dumps(receipt, indent=2) + "\n", encoding="utf-8"
          )
          print(json.dumps(receipt, indent=2))
          PY

      - name: Upload resolver evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fieldwork-oomd-managed-message-resolver-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: warn
          retention-days: 14
