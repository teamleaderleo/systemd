name: Apply vmspawn repair to controlled branch

on:
  pull_request:
    branches:
      - automation/vmspawn-repair-base
    paths:
      - .github/vmspawn-repair-trigger

permissions:
  contents: write

jobs:
  mutate-repair-branch:
    if: >-
      github.repository == 'teamleaderleo/systemd' &&
      github.head_ref == 'automation/vmspawn-repair-trigger'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10

    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: repair/vmspawn-unmapped-bind-userns-2dd0706
          fetch-depth: 0

      - name: Apply bounded source guard
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/vmspawn/vmspawn.c')
          text = path.read_text()

          function_start = text.index('static int start_virtiofsd(')
          start = text.index('                r = namespace_enter(\n', function_start)
          end_marker = '\n                if (userns_fd >= 0 && unshare(CLONE_NEWNS) < 0) {'
          end = text.index(end_marker, start)
          old = text[start:end]

          required = (
              'userns_fd,',
              'Failed to enter user namespace for virtiofsd: %m',
              '_exit(EXIT_FAILURE);',
          )
          missing = [item for item in required if item not in old]
          if missing:
              raise SystemExit(f'unexpected namespace-entry block; missing {missing!r}')

          new = '''                if (userns_fd >= 0) {
                          r = namespace_enter(
                                          /* pidns_fd= */ -EBADF,
                                          /* mntns_fd= */ -EBADF,
                                          /* netns_fd= */ -EBADF,
                                          userns_fd,
                                          /* root_fd= */ -EBADF);
                          if (r < 0) {
                                  log_error_errno(r, "Failed to enter user namespace for virtiofsd: %m");
                                  _exit(EXIT_FAILURE);
                          }
                  }
          '''.rstrip('\n')

          path.write_text(text[:start] + new + text[end:])
          PY

          bash -n test/units/TEST-87-AUX-UTILS-VM.vmspawn-user-bind.sh
          git diff --check

      - name: Commit repair branch
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'Linux Fieldwork'
          git config user.email 'fieldwork@example.invalid'
          git rm .github/workflows/bootstrap-vmspawn-unmapped-bind-repair.yml
          git add src/vmspawn/vmspawn.c test/units/TEST-87-AUX-UTILS-VM.vmspawn-user-bind.sh
          git commit -m 'vmspawn: skip namespace entry without user namespace'
          git push origin HEAD:repair/vmspawn-unmapped-bind-userns-2dd0706
