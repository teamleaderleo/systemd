---
# SPDX-License-Identifier: LGPL-2.1-or-later
name: Fieldwork OOMD lifecycle session token GC

on:
  push:
    branches:
      - linux-fieldwork/oomd-lifecycle-session-token-gc
  pull_request:
    paths:
      - ".github/workflows/fieldwork-oomd-lifecycle-session-token-gc.yml"
      - "contrib/fieldwork/oomd-lifecycle-session-token-gc.patch"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.sha }}
  cancel-in-progress: true

env:
  EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  lifecycle-session-token-gc:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify execution identity
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          mkdir -p fieldwork-evidence
          {
            echo "EXPECTED_HEAD=$EXPECTED_HEAD"
            echo "ACTUAL_HEAD=$(git rev-parse HEAD)"
            echo "BASE_LIFECYCLE_BLOB=$(git rev-parse HEAD:src/oom/oomd-reporter-lifecycle.c)"
            echo "BASE_HEADER_BLOB=$(git rev-parse HEAD:src/oom/oomd-reporter-lifecycle.h)"
            echo "BASE_TEST_BLOB=$(git rev-parse HEAD:src/oom/test-oomd-reporter-lifecycle.c)"
            echo "PATCH_BLOB=$(git rev-parse HEAD:contrib/fieldwork/oomd-lifecycle-session-token-gc.patch)"
            echo "PRODUCT_SOURCE_COMMITTED=false"
            echo "MANAGER_INTEGRATION=false"
            echo "EXTERNAL_CONTACT=false"
          } | tee fieldwork-evidence/receipt.txt

      - name: Apply lifecycle collection candidate
        shell: bash
        run: |
          set -euxo pipefail
          git apply --check contrib/fieldwork/oomd-lifecycle-session-token-gc.patch
          git apply contrib/fieldwork/oomd-lifecycle-session-token-gc.patch
          git diff --check
          git diff -- src/oom/oomd-reporter-lifecycle.c src/oom/oomd-reporter-lifecycle.h src/oom/test-oomd-reporter-lifecycle.c | tee fieldwork-evidence/applied.diff
          cp src/oom/oomd-reporter-lifecycle.c fieldwork-evidence/oomd-reporter-lifecycle.c
          cp src/oom/oomd-reporter-lifecycle.h fieldwork-evidence/oomd-reporter-lifecycle.h
          cp src/oom/test-oomd-reporter-lifecycle.c fieldwork-evidence/test-oomd-reporter-lifecycle.c
          {
            echo "PATCHED_LIFECYCLE_BLOB=$(git hash-object src/oom/oomd-reporter-lifecycle.c)"
            echo "PATCHED_HEADER_BLOB=$(git hash-object src/oom/oomd-reporter-lifecycle.h)"
            echo "PATCHED_TEST_BLOB=$(git hash-object src/oom/test-oomd-reporter-lifecycle.c)"
          } | tee -a fieldwork-evidence/receipt.txt

      - uses: systemd/mkosi@f7762b71437227922a367bb89597843c77494ef9

      - name: Configure Arch tools tree
        run: |
          tee mkosi/mkosi.local.conf <<EOF
          [Distribution]
          Distribution=arch
          Release=rolling

          [Build]
          ToolsTreeDistribution=arch
          ToolsTreeRelease=rolling
          WithTests=yes
          Environment=
                  CFLAGS="-Og"
                  MESON_OPTIONS=--werror
          EOF

      - name: Build tools tree
        run: sudo mkosi -f box -- true

      - name: Configure Meson
        run: |
          sudo mkosi box -- meson setup \
            --buildtype=debugoptimized \
            -Dbpf-framework=disabled \
            build

      - name: Compile lifecycle and registry tests
        shell: bash
        run: |
          set -o pipefail
          sudo mkosi box -- meson compile -C build \
            test-oomd-reporter-lifecycle test-oomd-reporter-registry \
            |& tee fieldwork-evidence/compile.txt

      - name: Run lifecycle and registry tests
        shell: bash
        run: |
          set -o pipefail
          sudo mkosi box -- meson test -C build --no-rebuild --print-errorlogs \
            test-oomd-reporter-lifecycle test-oomd-reporter-registry \
            |& tee fieldwork-evidence/test.txt

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fieldwork-oomd-lifecycle-session-token-gc-${{ github.run_id }}-${{ github.run_attempt }}
          path: fieldwork-evidence
          if-no-files-found: error
          retention-days: 14
